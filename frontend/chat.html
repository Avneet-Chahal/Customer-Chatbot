<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <title>Chat — SupportAI</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a href="/" class="logo">Support<span class="logo-accent">AI</span></a>
          <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/chat.html" class="active">Chat</a>
          </nav>
          <div class="header-actions">
            <button type="button" id="theme-toggle" class="theme-toggle btn btn-ghost btn-sm" aria-label="Toggle theme">🌙</button>
            <span id="user-badge" class="user-badge"></span>
            <button type="button" id="logout-btn" class="btn btn-ghost btn-sm">Log out</button>
          </div>
        </div>
      </header>

      <main id="chat-page" class="main-content chat-page container">
        <div class="chat-header">
          <div>
            <h1>Support Chat</h1>
            <p>Logged in as <strong id="chat-username"></strong></p>
          </div>
          <button type="button" id="clear-chat" class="btn btn-ghost btn-sm">Clear chat</button>
        </div>
        <div class="chat-panel">
          <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
          <p id="chat-error" class="chat-error hidden"></p>
          <form id="chat-form" class="chat-input-row">
            <input id="chat-input" type="text" placeholder="Type your message… e.g. Where is my order?" aria-label="Message" required />
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        </div>
      </main>
    </div>
    <script src="/js/app.js"></script>
  </body>
</html>
